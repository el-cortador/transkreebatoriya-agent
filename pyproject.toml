[project]
name = "transkreebatoriya-agent"
version = "0.1.0"
description = "Local transcription and transcript cleanup service built with FastAPI, faster-whisper, and Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "setuptools>=65.0",
    "uvicorn>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end тесты против живого сервера (требуют TRANSKREE_INTEGRATION=1)",
]

[tool.uv]
package = false
