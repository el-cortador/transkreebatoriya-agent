services:
  app:
    build:
      context: .
    container_name: transkreebatoriya-app
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      FFMPEG_PATH: ffmpeg
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_API_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      POSTPROCESS_CONCURRENCY: ${POSTPROCESS_CONCURRENCY:-1}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-1800}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-768}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.15}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P:-0.9}
      OLLAMA_TOP_K: ${OLLAMA_TOP_K:-30}
      OLLAMA_MIN_P: ${OLLAMA_MIN_P:-0.05}
      OLLAMA_REPEAT_LAST_N: ${OLLAMA_REPEAT_LAST_N:-128}
      OLLAMA_REPEAT_PENALTY: ${OLLAMA_REPEAT_PENALTY:-1.08}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-pro}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-300}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.15}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-768}
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      MAX_FILE_SIZE_GB: ${MAX_FILE_SIZE_GB:-6}
      TASK_TTL_HOURS: ${TASK_TTL_HOURS:-24}
    ports:
      - "${APP_PORT:-8001}:8001"
    volumes:
      - transkreebatoriya-temp:/app/temp
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: transkreebatoriya-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: transkreebatoriya-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  transkreebatoriya-temp:
  huggingface-cache:
  ollama-data:
